<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" width="1080" height="530" role="img" aria-label="What I build. voice-agents: Real-time phone and web voice agents (Phone / WebRTC to Speech-to-text to LLM + tools to Text-to-speech), using LiveKit Agents, Twilio, Deepgram, ElevenLabs, Silero VAD. agent-systems: Multi-agent workflows with tools and memory (Task to Orchestrator to Specialist agents to MCP tools + RAG), using Google ADK (A2A), MCP, OpenAI, Gemini, Pinecone, Langfuse. ai-video: Automated video production (Script to Narration to Shot assets to Rendered video), using LLM scripting, TTS narration, AWS Step Functions, S3. ai-products: Full-stack apps around AI backends (Web / mobile UI to API layer to LLM services to PostgreSQL), using Next.js, React Native, FastAPI, NestJS, Supabase, Neon.">
