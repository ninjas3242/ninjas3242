name: Refresh profile card
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read GitHub stats and render the terminal
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          gh api graphql -f query='query($login:String!){user(login:$login){createdAt repositories(ownerAffiliations:OWNER, privacy:PUBLIC){totalCount} contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' -f login="$PROFILE_OWNER" | python3 scripts/terminal_profile.py
      - name: Publish changed terminal
        run: |
          git add -- assets/terminal.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh profile terminal'
            git push
          fi
